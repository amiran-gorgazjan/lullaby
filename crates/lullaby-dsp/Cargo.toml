[package]
name = "lullaby-dsp"
version = "0.1.2"
edition = "2024"
license-file = "../../LICENSE"
publish = false

[features]
# Offline Engine diagnostics: absent from default plugin and DSP builds.
dsp-diagnostics = []

[[example]]
name = "diagnostic_trace"
required-features = ["dsp-diagnostics"]

[dependencies]
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
