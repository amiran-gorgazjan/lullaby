[package]
name = "lullaby-dsp"
version = "0.1.2"
edition = "2024"
license = "MIT"

[features]
# Offline research only: absent from the default plugin and DSP builds.
research-trace = []

[[example]]
name = "diagnostic_trace"
required-features = ["research-trace"]

[dependencies]
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
