name: Inspect Intel AU discovery
on:
  push:
    branches: [codex/beta-au-discovery]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: beta-macOS-universal-e4feb3666d147f72d0f9d05f76aa341071e5ab44
          run-id: 38785617318
          github-token: ${{ github.token }}
          path: target/diagnostic-download
          digest-mismatch: error
      - name: Verify the existing package and inspect discovery
        run: |
          python scripts/package_release.py --check target/diagnostic-download/Lullaby-0.2.0-beta.1-macOS-universal.zip --expected-commit e4feb3666d147f72d0f9d05f76aa341071e5ab44
          ditto -x -k target/diagnostic-download/Lullaby-0.2.0-beta.1-macOS-universal.zip target/diagnostic-package
          python scripts/diagnose_au.py target/diagnostic-package/Lullaby-0.2.0-beta.1-macOS-universal/Lullaby.component
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intel-discovery-${{ github.run_id }}
          path: target/au-discovery/*
          if-no-files-found: error
          retention-days: 7
