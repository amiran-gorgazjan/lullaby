name: Build and test plugins
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache locked dependencies for all supported platforms.
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo xtask bundle lullaby --release --locked
      - run: python scripts/clap_smoke.py
      - name: Build and test AUv2
        if: runner.os == 'macOS'
        run: cargo xtask bundle-au lullaby --release --locked
      - name: Validate AUv2 with Apple's auval
        if: runner.os == 'macOS'
        run: python3 scripts/auval.py
      - uses: actions/upload-artifact@v4
        with:
          name: Lullaby-${{ runner.os }}-${{ runner.arch }}
          path: target/bundled/
