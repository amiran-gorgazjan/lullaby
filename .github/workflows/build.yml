name: Build and test plugins
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
      - run: cargo xtask bundle lullaby --release --locked
      - run: python scripts/clap_smoke.py
      - name: Build and test AUv2
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo xtask bundle-au lullaby --release --locked --universal
      - name: Validate AUv2 with Apple's auval
        if: runner.os == 'macOS'
        run: python3 scripts/auval.py
      - name: Package release archives and license notices
        shell: bash
        run: |
          platform="${{ runner.os }}-${{ runner.arch }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then platform="macOS-universal"; fi
          python scripts/package_release.py --platform "$platform"
      - uses: actions/upload-artifact@v4
        with:
          name: Lullaby-${{ runner.os }}-${{ runner.arch }}
          path: target/release-assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" release-assets/* --verify-tag \
            --title "Lullaby ${tag#v}" --notes-file "docs/releases/${tag#v}.md"
